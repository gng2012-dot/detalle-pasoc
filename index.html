<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Detalle de cuenta</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#fbf6f8;--fg:#2b2328;--mut:#7a6b72;--line:#e6d3dc;--acc:#c2185b;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e171b;--fg:#f3e8ee;--mut:#b3a1aa;--line:#4a3841;--card:#2a2026}}
:root[data-theme="dark"]{--bg:#1e171b;--fg:#f3e8ee;--mut:#b3a1aa;--line:#4a3841;--card:#2a2026}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif}
main{display:grid;grid-template-columns:300px 1fr;gap:16px;padding:16px;max-width:1200px;margin:auto}
@media(max-width:800px){main{grid-template-columns:1fr}}
h1{font-size:20px;margin:0 0 12px}section{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}
button,input{font:inherit;color:inherit}button{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:8px 12px;cursor:pointer}
button.s{background:transparent;color:var(--acc);border:1px solid var(--line)}
input{background:transparent;border:1px solid var(--line);border-radius:5px;padding:5px 7px;width:100%}
label{display:block;margin:6px 0;font-size:13px;color:var(--mut)}
#list{max-height:45vh;overflow:auto;margin-top:8px}
.it{padding:6px 8px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}.it:hover{background:var(--line)}.it small{color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:13px}td{padding:2px}td:nth-child(1){width:100px}td:nth-child(3),td:nth-child(4){width:110px}td:last-child{width:34px}
.cv{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:#fff;margin-bottom:12px}canvas{display:block;max-width:100%;height:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;align-items:center}.row input{width:auto}#msg{color:var(--mut);font-size:13px}
</style></head><body>
<main>
<section>
<h1>Detalle de cuenta</h1>
<label>PDF de saldos por zona<input type="file" id="pdf" accept="application/pdf"></label>
<p id="msg"></p>
<input id="q" placeholder="Buscar cliente o código" disabled>
<div id="list"></div>
</section>
<section>
<div class="cv"><canvas id="c"></canvas></div>
<div class="row"><input id="fd" style="width:110px" title="Fecha"><input id="nm" style="width:260px" title="Cliente"><input id="cd" style="width:80px" title="Código"></div>
<table><tbody id="tb"></tbody></table>
<div class="row"><button class="s" id="add">Agregar fila</button>
<label style="margin:0"><input type="checkbox" id="auto" checked> Total automático</label>
<input id="tot" style="width:130px" placeholder="Total">
<button id="dl">Descargar PNG</button></div>
</section>
</main>
